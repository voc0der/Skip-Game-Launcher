name: Game request
description: Ask for every supported-store launcher for a game
title: "[Game] "
labels: ["game-request"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and a maintainer will apply the **approved** label, which
        uses the selected store as a seed, finds the same game on every
        supported storefront, builds all matching launchers, opens a PR and
        merges it automatically.

        Pick any store where you know the game exists. That choice does not
        limit the result to one store. Existing games are also scanned again
        for any storefronts they are missing.

  - type: input
    id: name
    attributes:
      label: Game name
      description: As it appears on the store page. Spelling matters for the Steam lookup.
      placeholder: Portal 2
    validations:
      required: true

  - type: dropdown
    id: store
    attributes:
      label: Store
      description: A known store used to anchor the title; CI will scan all four stores.
      options:
        - Steam
        - Battle.net
        - Epic Games
        - Ubisoft Connect
    validations:
      required: true

  - type: input
    id: appid
    attributes:
      label: App ID / product code
      description: |
        Optional override for the selected seed store. Normally CI resolves it
        from the title, then searches Steam, Epic, Battle.net and Ubisoft
        automatically. Steam and Ubisoft use numeric IDs; Epic uses an internal
        app/artifact name; Battle.net uses a short product code.
      placeholder: "620"

  - type: input
    id: filename
    attributes:
      label: Output filename
      description: Optional. Defaults to the game name with the punctuation stripped.
      placeholder: Portal2.exe

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I checked `games.json`; this game is missing entirely or is missing a store
          required: true
